name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
      - run: go mod download
      - run: gofmt -l . | tee /tmp/fmt.out
      - run: test ! -s /tmp/fmt.out
      - run: go vet ./...
      - run: go test ./...
      - run: make build-all VERSION=${{ github.ref_name }}
      - uses: actions/upload-artifact@v4
        with:
          name: zlt-unlocker-release
          path: dist/
