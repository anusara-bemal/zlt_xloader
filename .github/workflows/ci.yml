name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format, vet, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Check gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: Vet
        run: go vet ./...
      - name: Test with coverage
        run: go test -race -coverprofile=coverage.txt ./...
      - name: Build host binary
        run: make build VERSION=${{ github.ref_name }}
      - name: Smoke test
        run: ./zlt_xloader version

  cross-compile:
    name: Cross-compile release matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: make build-all VERSION=${{ github.ref_name }}
      - uses: actions/upload-artifact@v4
        with:
          name: zlt_xloader-all
          path: dist/
          if-no-files-found: error
