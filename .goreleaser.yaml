add version: 2

project_name: zlt_xloader

before:
  hooks:
    # Download only. Running `go mod tidy` here rewrites line endings in
    # go.mod/go.sum and makes the checkout dirty, which aborts GoReleaser.
    - go mod download

builds:
  - id: zlt_xloader
    main: .
    binary: zlt_xloader
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/anusara-bemal/zlt_xloader/internal/buildinfo.Version={{ .Version }}
      - -X github.com/anusara-bemal/zlt_xloader/internal/buildinfo.Commit={{ .FullCommit }}
      - -X github.com/anusara-bemal/zlt_xloader/internal/buildinfo.Date={{ .Date }}
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
      - "386"
      - arm
    goarm:
      - "7"
    ignore:
      - goos: darwin
        goarch: "386"
      - goos: darwin
        goarch: arm
      - goos: windows
        goarch: arm
      - goos: windows
        goarch: arm64

archives:
  - id: default
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - NOTICE
      - README.md
      - profiles/*

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
      - Merge pull request
      - Merge branch

release:
  name_template: "{{ .ProjectName }} {{ .Version }}"
  prerelease: auto
